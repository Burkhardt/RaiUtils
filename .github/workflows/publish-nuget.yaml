name: Publish NuGet
run-name: Publish ${{ inputs.release_ref || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Existing immutable release tag to publish (vX.Y.Z)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_REF: ${{ inputs.release_ref || github.ref_name }}

    steps:
      - name: Validate release tag input
        shell: bash
        run: |
          if [[ ! "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release ref must be an immutable vX.Y.Z tag."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_REF }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Validate tag matches csproj version
        shell: bash
        run: |
          TAG_VERSION="${RELEASE_REF#v}"
          CSPROJ_VERSION=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' RaiUtils.csproj | head -n 1)
          echo "Release commit: $(git rev-parse HEAD)"
          echo "Tag version: ${TAG_VERSION}"
          echo "Project version: ${CSPROJ_VERSION}"
          if [[ "${TAG_VERSION}" != "${CSPROJ_VERSION}" ]]; then
            echo "Tag version does not match RaiUtils.csproj <Version>."
            exit 1
          fi

      - name: Restore
        run: dotnet restore RaiUtils.slnx

      - name: Build
        run: dotnet build RaiUtils.slnx --configuration Release --no-restore

      - name: Pack
        shell: bash
        run: |
          PACKAGE_OUTPUT="$RUNNER_TEMP/raiutils-nuget-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'PACKAGE_OUTPUT=%s\n' "$PACKAGE_OUTPUT" >> "$GITHUB_ENV"
          dotnet pack RaiUtils.csproj --configuration Release --no-build --output "$PACKAGE_OUTPUT"

      - name: Verify publication package
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import zipfile

          version = os.environ["RELEASE_REF"][1:]
          output = Path(os.environ["PACKAGE_OUTPUT"])
          expected = output / f"RaiUtils.{version}.nupkg"
          packages = list(output.glob("*.nupkg"))
          if packages != [expected]:
              raise SystemExit(f"Expected only {expected.name}; found {[p.name for p in packages]}")
          with zipfile.ZipFile(expected) as archive:
              manifests = [name for name in archive.namelist() if name.endswith(".nuspec")]
              if len(manifests) != 1:
                  raise SystemExit("Package must contain exactly one nuspec")
              root = ET.fromstring(archive.read(manifests[0]))
          values = {node.tag.rsplit("}", 1)[-1]: node.text for node in root.iter()}
          if values.get("id") != "RaiUtils" or values.get("version") != version:
              raise SystemExit("Package identity/version does not match the release")
          print(f"Verified RaiUtils {version}")
          PY

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: Burkhardt

      - name: Publish to NuGet
        run: |
          dotnet nuget push "$PACKAGE_OUTPUT/RaiUtils.${RELEASE_REF#v}.nupkg" \
            --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate
